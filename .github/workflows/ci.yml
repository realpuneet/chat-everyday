name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379
      TEST_MONGO_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - name: Static checks (node --check, eslint no-unused/no-undef)
        run: npm run check
      - name: OpenAPI is up to date
        run: node scripts/gen-openapi.mjs && git diff --exit-code ../docs/openapi.json
      - name: Unit + integration tests (real Redis + MongoDB)
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Static checks (esbuild bundle + eslint)
        run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Start API
        working-directory: backend
        env:
          NODE_ENV: development
          RATE_LIMIT_MULTIPLIER: "1000"
          TRUST_PROXY: "1"
          MONGO_URI: mongodb://localhost:27017/ce_e2e
          REDIS_URL: redis://localhost:6379
          LOG_LEVEL: warn
        run: nohup node src/server.js > /tmp/api.log 2>&1 &
      - name: Serve built app
        working-directory: frontend
        run: nohup npm run preview > /tmp/web.log 2>&1 &
      - run: npx playwright-core install --with-deps chromium
        working-directory: frontend
      - name: Wait for services
        run: |
          for i in $(seq 1 40); do curl -sf localhost:4000/readyz && curl -sf localhost:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/api.log /tmp/web.log; exit 1
      - name: Browser smoke test (Playwright)
        working-directory: frontend
        run: node e2e/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: docs/screenshots }

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t chat-api ./backend
      - run: docker build -t chat-web ./frontend
      - name: Validate compose file
        env: { JWT_ACCESS_SECRET: a, JWT_GUEST_SECRET: b, PEPPER: c, URL_SIGNING_SECRET: d, ENCRYPTION_KEY: e }
        run: docker compose config -q

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true   # informational: review results, do not block merges
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
