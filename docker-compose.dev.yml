# Just the data stores for local development:  docker compose -f docker-compose.dev.yml up -d
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-dev:/data/db]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
volumes:
  mongo-dev:
