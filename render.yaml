# Render Blueprint: backend API (+ inline image worker) and Redis (Key Value).
# MongoDB is NOT offered by Render: create a free MongoDB Atlas cluster and paste its URI into MONGO_URI.
services:
  - type: web
    name: chat-everyday-api
    runtime: node
    rootDir: backend
    plan: starter            # websockets + background sweeper need an always-on instance (free tier sleeps)
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: "2" }              # Vercel rewrite + Render proxy
      - { key: RUN_WORKER_INLINE, value: "true" }
      - { key: MONGO_URI, sync: false }               # mongodb+srv://... (Atlas)
      - key: REDIS_URL
        fromService: { type: keyvalue, name: chat-everyday-redis, property: connectionString }
      - { key: PUBLIC_URL, sync: false }              # https://chat-everyday-api.onrender.com
      - { key: CORS_ORIGINS, sync: false }            # https://<your-app>.vercel.app
      - { key: JWT_ACCESS_SECRET, generateValue: true }
      - { key: JWT_GUEST_SECRET, generateValue: true }
      - { key: PEPPER, generateValue: true }
      - { key: URL_SIGNING_SECRET, generateValue: true }
      - { key: ENCRYPTION_KEY, sync: false }          # openssl rand -base64 32
      - { key: ADMIN_EMAILS, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: OTP_PROVIDER, value: console }
      - { key: STORAGE_PROVIDER, value: local }       # ephemeral disk: switch to s3/R2 for real use
  - type: keyvalue
    name: chat-everyday-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []          # private network only
