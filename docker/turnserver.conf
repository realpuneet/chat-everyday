# coturn: time-limited credentials (use-auth-secret); the secret is injected from TURN_SECRET by docker-compose.
listening-port=3478
fingerprint
use-auth-secret
no-cli
no-multicast-peers
min-port=49160
max-port=49200
# never relay into private networks (prevents SSRF-style abuse of the TURN server)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
total-quota=200
user-quota=12
